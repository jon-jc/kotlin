services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roam_test
      POSTGRES_USER: roam_test
      POSTGRES_PASSWORD: local-integration-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roam_test -d roam_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 256m
